name: Purumi UBot 24/7

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Memicu build otomatis setiap hari agar bot tetap aktif 24/7 di GitHub Actions
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Kode Repository
      uses: actions/checkout@v4

    - name: Siapkan Python (Versi Terbaru)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instal Dependensi & Pustaka Modern
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Jalankan Userbot (24/7)
      env:
        STRING_SESSION: ${{ secrets.STRING_SESSION }}
      run: |
        python main.py
        
